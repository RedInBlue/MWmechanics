[AIBalance]
; Lowest performance rating (0..1) the AI plans with, per axis (top speed, handling, acceleration).
; Against a player car rated below the floor, the AI plans part of the way from your car to its own;
; at or above it, the AI plans with the weaker of the two cars. 1 = AI always uses its own car.
; Leave a value empty to keep the game's.
; Career races (stock 0.75)
CareerFloor=0.5
; Career races where race query 0x63D720 is true (stock 0.7)
CareerFloorAlt=0.45
; Quick race and other modes, plus career races where 0x63E180 is true, probably bosses (stock 1.0)
OtherFloor=

; Career races: instead of the fixed floor, the AI plans this far above your car's rating on each axis
; (capped by its own car). Replaces CareerFloor/CareerFloorAlt when set; bosses and other modes keep theirs. Empty = off.
RelativeMargin=

; Career adaptive difficulty (-1..1, saved in your career, moved by your results) as ComputeSkill sees it.
; Generic opponents' skill is about 0.28 + 0.81 * value (0.1 -> 0.36, 0.3 -> 0.52, 0.6 -> 0.77). Empty = no clamp.
AdaptiveMin=
AdaptiveMax=

; Career catch-up strength cap over race progress (0%, 25%, 50%, 75%, 100%), blended between Low
; (adaptive -1) and High (adaptive +1). Stock Low 0.75,0.75,0.75,0.5,0 and High 0.75,0.75,0.75,0.75,0.25:
; catch-up fades out over the last quarter, so trailing AIs give up late. 0.75 everywhere keeps it to the end.
; Applies to leaders' slow-down too. Empty = stock.
CatchUpCapLow=
CatchUpCapHigh=
; Gap in metres at which catch-up reaches full strength, same 5 progress points and Low/High blend.
; Stock Low 1000,900,750,750,800 and High 300,275,250,150,250 (about 440 m at the start with adaptive 0.6).
; Smaller = AIs react to smaller gaps: trailing ones push sooner, leaders ease off sooner (tighter pack).
; One value fills all five points. Minimum 100. Empty = stock.
CatchUpSpreadLow=
CatchUpSpreadHigh=
; Catch-up torque factor (stock 0.5): trailing AIs get torque * (1 + clamp(skill + glue - 1, 0, 1) * this * 0.75).
; Empty = stock.
CatchUpTorque=

; Career: cut AI racers' engine torque the weaker your car accelerates. Torque factor becomes
; 1 + 0.75 * (catch-up cheat - TorqueMatch * (1 - your acceleration rating)), never below 0.25.
; Stock starter (accel rating 0.18): 0.5 -> about x0.69, 0.8 -> x0.51 when the AI isn't catching up.
; Maxed car (0.96): almost no effect. The wingman's active boost is untouched. Empty = off.
TorqueMatch=
