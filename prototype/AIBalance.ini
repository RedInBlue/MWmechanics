[AIBalance]
; Career AI tuning for NFS Carbon. Every key is optional: empty = the game's behaviour.
; The values below are the ones tested on sf.5.4 (see AI_Rebalance_Plan.md).

; ---- Scaling with your car (no tiers) ----
; Your car's rating = mean of its top speed, handling and acceleration ratings (stock starter about 0.29,
; fully upgraded about 0.91). At RatingWeak or below the AtWeak values apply, at RatingStrong or above the
; AtStrong ones, and in between they blend. Raise the AtStrong values (or lower RatingStrong) to make the
; ceiling harder.
RatingWeak=0.3
RatingStrong=0.9
; How far above your car's rating (per axis) the AI plans, capped by its own car. Replaces the fixed career
; floor; bosses and other modes keep theirs. Setting only one of the pair uses it for both.
MarginAtWeak=0.05
MarginAtStrong=0.15
; AI skill via the career adaptive difficulty (-1..1). Generic opponents' skill is about 0.28 + 0.81 * value
; (0.2 -> 0.44, 0.4 -> 0.60, 0.6 -> 0.77, 1.0 -> 1.0). Replaces the value saved in your career.
AdaptiveAtWeak=0.2
AdaptiveAtStrong=0.6

; ---- Quick race ----
; 1 = quick races scale with your car too: the margin and TorqueMatch apply, and AI skill becomes the career
; skill for your car plus the offset for the difficulty you pick (needs AdaptiveAtWeak/AtStrong). The catch-up
; settings below apply to quick races either way (when catch-up is on in the race options).
QuickRace=1
QuickRaceEasy=-0.2
QuickRaceMedium=0
QuickRaceHard=0.2

; ---- Catch-up ----
; Strength cap over race progress (0%, 25%, 50%, 75%, 100%), blended between Low (adaptive -1) and High
; (adaptive +1). Stock Low 0.75,0.75,0.75,0.5,0 and High 0.75,0.75,0.75,0.75,0.25: catch-up fades out over the
; last quarter, so trailing AIs give up late. Also applies to leaders' slow-down. One value fills all five.
CatchUpCapLow=0.75
CatchUpCapHigh=0.75
; Gap in metres at which catch-up reaches full strength, same layout. Stock Low 1000,900,750,750,800 and
; High 300,275,250,150,250 (about 440 m at the start). Smaller = AIs react to smaller gaps (tighter pack).
; Minimum 100.
CatchUpSpreadLow=150
CatchUpSpreadHigh=150
; Catch-up torque factor (stock 0.5): trailing AIs get torque * (1 + clamp(skill + glue - 1, 0, 1) * this * 0.75).
CatchUpTorque=1.0
; Cut AI racers' engine torque the weaker your car accelerates: torque factor becomes
; 1 + 0.75 * (catch-up cheat - TorqueMatch * weakness), never below 0.25. The wingman's active boost is untouched.
; weakness = (1 - your acceleration rating) / (1 - TorqueMatchHold), at most 1: the full cut applies up to
; TorqueMatchHold, then fades to nothing at 1.0, so early upgrades keep it. Empty or 0 = 1 - your rating.
; Hold 0.5: TorqueMatch 0.41 gives about x0.69 up to accel 0.5 (same as 0.5 without Hold on the stock starter),
; x0.85 at 0.75, and almost no effect on a maxed car (0.96).
TorqueMatch=0.41
TorqueMatchHold=0.5

; ---- Fixed alternatives (used when the scaled keys above are empty) ----
; Fixed margin above your car's rating, instead of MarginAtWeak/MarginAtStrong.
RelativeMargin=
; Clamp the adaptive value (also applied after AdaptiveAtWeak/AdaptiveAtStrong). Set both equal to pin it.
AdaptiveMin=
AdaptiveMax=
; Fixed floors for the AI performance bias. Career (stock 0.75), career when race query 0x63D720 is true
; (stock 0.7), and quick race / other modes / career bosses (stock 1.0). Margins replace the two career ones.
CareerFloor=
CareerFloorAlt=
OtherFloor=
